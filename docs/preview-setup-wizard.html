<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preview - Setup Wizard ADESHOP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .setup-container {
            max-width: 500px;
            width: 100%;
            padding: 20px;
        }
        
        .setup-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            animation: slideIn 0.5s ease-out;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .setup-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .setup-header .icon {
            font-size: 4rem;
            color: #667eea;
            margin-bottom: 15px;
        }
        
        .setup-header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #333;
            margin-bottom: 10px;
        }
        
        .setup-header p {
            color: #666;
            font-size: 0.95rem;
        }
        
        .form-label {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }
        
        .form-control {
            border-radius: 10px;
            padding: 12px 15px;
            border: 2px solid #e1e8ed;
            transition: all 0.3s ease;
        }
        
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        
        .btn-create {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            padding: 14px;
            font-weight: 600;
            font-size: 1.05rem;
            transition: transform 0.2s ease;
        }
        
        .btn-create:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        
        .alert {
            border-radius: 10px;
            border: none;
        }
        
        .success-animation {
            text-align: center;
        }
        
        .success-animation .icon {
            font-size: 5rem;
            color: #28a745;
            animation: bounce 0.5s ease;
        }
        
        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .preview-note {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 15px 20px;
            border-radius: 10px;
            font-size: 0.9rem;
            z-index: 1000;
        }
    </style>
</head>
<body>

<div class="preview-note">
    <i class="bi bi-info-circle"></i> Vista previa del Setup Wizard
</div>

<div class="setup-container">
    <div class="setup-card">
        <div class="setup-header">
            <i class="bi bi-gear-fill icon"></i>
            <h1>Configuración Inicial</h1>
            <p>Crea el primer administrador del sistema</p>
        </div>
        
        <form class="needs-validation" novalidate onsubmit="event.preventDefault(); showSuccess();">
            <div class="mb-3">
                <label for="username" class="form-label">
                    <i class="bi bi-person-fill"></i> Usuario <span class="text-danger">*</span>
                </label>
                <input 
                    type="text" 
                    class="form-control" 
                    id="username" 
                    name="username" 
                    required
                    minlength="3"
                    placeholder="Ingrese el nombre de usuario"
                >
            </div>
            
            <div class="mb-3">
                <label for="email" class="form-label">
                    <i class="bi bi-envelope-fill"></i> Correo Electrónico <span class="text-danger">*</span>
                </label>
                <input 
                    type="email" 
                    class="form-control" 
                    id="email" 
                    name="email" 
                    required
                    placeholder="admin@ejemplo.com"
                >
            </div>
            
            <div class="mb-3">
                <label for="cedula" class="form-label">
                    <i class="bi bi-card-text"></i> Cédula <span class="text-danger">*</span>
                </label>
                <input 
                    type="text" 
                    class="form-control" 
                    id="cedula" 
                    name="cedula" 
                    required
                    maxlength="10"
                    pattern="[0-9]{10}"
                    placeholder="Ingrese 10 dígitos"
                >
                <small class="form-text text-muted">Debe contener exactamente 10 dígitos numéricos.</small>
            </div>
            
            <div class="mb-3">
                <label for="password" class="form-label">
                    <i class="bi bi-lock-fill"></i> Contraseña <span class="text-danger">*</span>
                </label>
                <input 
                    type="password" 
                    class="form-control" 
                    id="password" 
                    name="password" 
                    required
                    minlength="6"
                    placeholder="Mínimo 6 caracteres"
                >
                <small class="form-text text-muted">La contraseña debe tener al menos 6 caracteres.</small>
            </div>
            
            <div class="mb-4">
                <label for="password_confirm" class="form-label">
                    <i class="bi bi-lock-fill"></i> Repetir Contraseña <span class="text-danger">*</span>
                </label>
                <input 
                    type="password" 
                    class="form-control" 
                    id="password_confirm" 
                    name="password_confirm" 
                    required
                    minlength="6"
                    placeholder="Repita la contraseña"
                >
            </div>
            
            <button type="submit" class="btn btn-primary btn-create w-100">
                <i class="bi bi-person-plus-fill"></i> Crear Administrador
            </button>
        </form>
    </div>
</div>

<!-- Pantalla de éxito (oculta por defecto) -->
<div class="setup-container" id="success-screen" style="display: none;">
    <div class="setup-card">
        <div class="success-animation">
            <i class="bi bi-check-circle-fill icon"></i>
            <h2 class="mb-3">¡Configuración Completada!</h2>
            <p class="text-muted mb-4">El administrador ha sido creado exitosamente.</p>
            <a href="#" class="btn btn-success btn-lg w-100" onclick="location.reload()">
                <i class="bi bi-box-arrow-in-right"></i> Ir a Iniciar Sesión
            </a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
// Validación de cédula en tiempo real (solo números)
document.getElementById('cedula')?.addEventListener('input', function(e) {
    this.value = this.value.replace(/[^0-9]/g, '');
    
    if (this.value.length !== 10) {
        this.setCustomValidity('La cédula debe tener exactamente 10 dígitos');
    } else {
        this.setCustomValidity('');
    }
});

// Validación de contraseñas en tiempo real
document.getElementById('password_confirm')?.addEventListener('input', function() {
    const password = document.getElementById('password').value;
    const passwordConfirm = this.value;
    
    if (password !== passwordConfirm) {
        this.setCustomValidity('Las contraseñas no coinciden');
        this.classList.add('is-invalid');
    } else {
        this.setCustomValidity('');
        this.classList.remove('is-invalid');
    }
});

// Validación del formulario Bootstrap
(function () {
    'use strict'
    var forms = document.querySelectorAll('.needs-validation')
    Array.prototype.slice.call(forms).forEach(function (form) {
        form.addEventListener('submit', function (event) {
            if (!form.checkValidity()) {
                event.preventDefault()
                event.stopPropagation()
            }
            form.classList.add('was-validated')
        }, false)
    })
})()

// Mostrar pantalla de éxito (solo para preview)
function showSuccess() {
    document.querySelector('.setup-container:first-of-type').style.display = 'none';
    document.getElementById('success-screen').style.display = 'block';
}
</script>

</body>
</html>
